<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Menedżer</title>
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <!-- View Switcher (Hidden) -->
    <div id="viewSwitcher" class="hidden">
        <button onclick="switchView('config')">Konfiguracja</button>
        <button onclick="switchView('customer')">Widok Klienta</button>
        <button onclick="switchView('staff')">Obsługa</button>
    </div>

    <!-- Configuration View -->
    <div id="configView" class="view">
        <div class="config-container">
            <h1>Konfiguracja</h1>

            <section class="config-section">
                <h2>Konsole</h2>
                <div id="consoleList"></div>
                <button onclick="addConsole()" class="btn-primary">
                    Nowa...
                </button>
            </section>

            <section class="config-section">
                <h2>Domyślne</h2>
                <div class="form-group">
                    <label for="graceMinutes">Czas na przyjście (minut)</label>
                    <input type="number" id="graceMinutes" min="1" max="30" value="5" />
                </div>
                <div class="form-group">
                    <label for="defaultMaxTime">Czas maksymalny gry (minut)</label>
                    <input type="number" id="defaultMaxTime" min="15" max="480" value="60" />
                </div>
                <button onclick="saveSettings()" class="btn-primary">
                    Zapisz
                </button>
            </section>
        </div>
    </div>

    <!-- Customer Facing View -->
    <div id="customerView" class="view hidden">
        <div class="customer-container">
            <h1 class="customer-header">Dostępne konsole</h1>
            <div id="customerConsoleGrid" class="console-grid"></div>
        </div>
    </div>

    <!-- Staff Facing View -->
    <div id="staffView" class="view hidden">
        <div class="staff-container">
            <h1>Panel sterowania</h1>
            <div id="staffConsoleGrid" class="console-grid"></div>
        </div>
    </div>

    <!-- Modals -->
    <div id="modalOverlay" class="modal-overlay hidden" onclick="closeModal()"></div>

    <!-- Start Session Modal -->
    <div id="startSessionModal" class="modal hidden">
        <h2>Rozpocznij...</h2>
        <div class="modal-content">
            <p id="modalConsoleInfo"></p>
            <div class="form-group">
                <label for="customerName">Imię użytkownika:</label>
                <input type="text" id="customerName" />
            </div>
            <div class="form-group">
                <label for="sessionDuration">Czas trwania (minut):</label>
                <input type="number" id="sessionDuration" min="15" max="480" value="60" />
            </div>
            <div id="conflictWarning" class="warning-message hidden"></div>
        </div>
        <div class="modal-buttons">
            <button onclick="confirmStartSession()" class="btn-primary">
                Start
            </button>
            <button onclick="closeModal()" class="btn-secondary">
                Anuluj
            </button>
        </div>
    </div>

    <!-- Reservation Modal -->
    <div id="reservationModal" class="modal hidden">
        <h2>Dodaj rezerwację</h2>
        <div class="modal-content">
            <p id="modalReservationInfo"></p>
            <div class="form-group">
                <label for="reservationCustomerName">Imię użytkownika:</label>
                <input type="text" id="reservationCustomerName" />
            </div>
            <div class="form-group">
                <label for="reservationStartTime">Czas rozpoczęcia (format 24h, np. 14:30):</label>
                <input type="text" id="reservationStartTime" placeholder="HH:MM" maxlength="5"
                    pattern="[0-9]{2}:[0-9]{2}" />
            </div>
            <div class="form-group">
                <label for="reservationDuration">Czas trwania (minut):</label>
                <input type="number" id="reservationDuration" min="15" max="480" value="60" />
            </div>
        </div>
        <div class="modal-buttons">
            <button onclick="confirmReservation()" class="btn-primary">
                Potwierdź
            </button>
            <button onclick="closeModal()" class="btn-secondary">
                Anuluj
            </button>
        </div>
    </div>

    <!-- Play Next Modal -->
    <div id="playNextModal" class="modal hidden">
        <h2>Dodaj następnego w kolejce</h2>
        <div class="modal-content">
            <p id="modalPlayNextInfo"></p>
            <div class="form-group">
                <label for="playNextCustomerName">Imię użytkownika:</label>
                <input type="text" id="playNextCustomerName" />
            </div>
            <div class="form-group">
                <label for="playNextDuration">Czas trwania (minut):</label>
                <input type="number" id="playNextDuration" min="15" max="480" value="60" />
            </div>
        </div>
        <div class="modal-buttons">
            <button onclick="confirmPlayNext()" class="btn-primary">
                Potwierdź
            </button>
            <button onclick="closeModal()" class="btn-secondary">
                Anuluj
            </button>
        </div>
    </div>

    <!-- End Session Confirmation Modal -->
    <div id="endSessionModal" class="modal hidden">
        <h2>Zakończ sesję</h2>
        <div class="modal-content">
            <p id="endSessionInfo"></p>
            <div class="form-group">
                <label>Stan sprzętu:</label>
                <div class="radio-group">
                    <label class="radio-label">
                        <input type="radio" name="sessionStatus" value="good" checked />
                        Wszystko w porządku
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="sessionStatus" value="damage" />
                        Uszkodzenia
                    </label>
                </div>
            </div>
            <div class="form-group hidden" id="damageDescriptionGroup">
                <label for="damageDescription">Opis uszkodzeń:</label>
                <textarea id="damageDescription" rows="3" placeholder="Opisz obserwowane uszkodzenia..."></textarea>
            </div>
        </div>
        <div class="modal-buttons">
            <button onclick="confirmEndSession()" class="btn-primary">
                Zakończ sesję
            </button>
            <button onclick="closeModal()" class="btn-secondary">
                Anuluj
            </button>
        </div>
    </div>

    <!-- Console Edit Modal -->
    <div id="consoleEditModal" class="modal hidden">
        <h2 id="consoleEditTitle">Dodaj konsolę</h2>
        <div class="modal-content">
            <div class="form-group">
                <label for="consoleName">Nazwa konsoli:</label>
                <input type="text" id="consoleName" placeholder="np., PS5 Stanowisko 1" />
            </div>
            <div class="form-group">
                <label for="consoleGames">Gry (rozdzielenie przecinkiem):</label>
                <textarea id="consoleGames" rows="3" placeholder="e.g., FIFA 24, Call of Duty, Fortnite"></textarea>
            </div>
            <div class="form-group">
                <label for="consoleMaxTime">Maksymalny czas gry (minut):</label>
                <input type="number" id="consoleMaxTime" min="15" max="480" value="60" />
            </div>
        </div>
        <div class="modal-buttons">
            <button onclick="saveConsole()" class="btn-primary">
                Zapisz
            </button>
            <button onclick="closeModal()" class="btn-secondary">
                Anuluj
            </button>
        </div>
    </div>

    <!-- Hidden trigger for view switcher (press Ctrl+Shift+V) -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>

</html>
